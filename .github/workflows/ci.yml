name: CI

on:
  push:
    branches: [main]
  pull_request:

# Repli sûr : tout accès DB tombe en mode offline (safe()), l'IP_SALT placeholder
# ne sert qu'à ne pas faire échouer le hash RGPD en mode production (jamais en prod réelle).
env:
  DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
  DIRECT_URL: postgres://ci:ci@127.0.0.1:5432/ci
  IP_SALT: ${{ secrets.IP_SALT || 'ci-only-salt-do-not-use-in-prod-0123456789' }}
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://www.analyticatech.fr' }}
  NEXT_PUBLIC_APP_VERSION: ci

jobs:
  quality:
    name: typecheck · lint · build · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm run check:perf


  e2e:
    name: e2e (Playwright, Chromium)
    runs-on: ubuntu-latest
    needs: quality
    # Le contenu éditorial étant versionné dans le code, les e2e ne dépendent
    # plus de la base : ils tournent à chaque push avec la base factice de CI
    # (repli offline). ALLOWED_ORIGINS couvre le serveur e2e (port 3210).
    timeout-minutes: 25
    env:
      ALLOWED_ORIGINS: http://localhost:3210,http://127.0.0.1:3210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
