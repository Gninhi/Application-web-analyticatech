name: CI

on:
  push:
    branches: [main]
  pull_request:

# Repli sûr : tout accès DB tombe en mode offline (safe()), l'IP_SALT placeholder
# ne sert qu'à ne pas faire échouer le hash RGPD en mode production (jamais en prod réelle).
env:
  DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
  DIRECT_URL: postgres://ci:ci@127.0.0.1:5432/ci
  IP_SALT: ${{ secrets.IP_SALT || 'ci-only-salt-do-not-use-in-prod-0123456789' }}
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://analyticatech.fr' }}
  NEXT_PUBLIC_APP_VERSION: ci

jobs:
  quality:
    name: typecheck · lint · build · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run check:perf
      - run: npm run test:unit


  e2e:
    name: e2e (Playwright, Chromium)
    runs-on: ubuntu-latest
    needs: quality
    # Les e2e requièrent de vrais contenus en base → gated sur le secret DATABASE_URL
    # (base Supabase publique, joignable depuis le runner). Absent = job skippé.
    if: ${{ secrets.DATABASE_URL != '' }}
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      IP_SALT: ${{ secrets.IP_SALT || 'ci-only-salt-do-not-use-in-prod-0123456789' }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://analyticatech.fr' }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS || 'http://localhost:3210,http://127.0.0.1:3210' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Déploiement VM (optionnel) : inerte tant que les secrets SSH_HOST/SSH_USER/SSH_KEY
  # ne sont pas posés. À adapter à ta VM si tu utilises systemd/pm2 plutôt que nohup.
  deploy:
    name: deploy → VM
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: ${{ github.ref == 'refs/heads/main' && secrets.SSH_HOST != '' }}
    environment: production
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.APP_DIR || '$HOME/app' }}"
            git pull origin main
            npm ci
            npx prisma generate
            npm run build
            pkill -f "next start" || true
            nohup npx next start -p 3001 > /tmp/next-prod.log 2>&1 &