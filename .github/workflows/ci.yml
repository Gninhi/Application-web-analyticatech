name: CI

on:
  push:
    branches: [main]
  pull_request:

# Repli sûr : tout accès DB tombe en mode offline (safe()), l'IP_SALT placeholder
# ne sert qu'à ne pas faire échouer le hash RGPD en mode production (jamais en prod réelle).
env:
  DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
  DIRECT_URL: postgres://ci:ci@127.0.0.1:5432/ci
  IP_SALT: ${{ secrets.IP_SALT || 'ci-only-salt-do-not-use-in-prod-0123456789' }}
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://www.analyticatech.fr' }}
  NEXT_PUBLIC_APP_VERSION: ci

jobs:
  quality:
    name: typecheck · lint · build · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm run check:perf


  e2e:
    name: e2e (Playwright, Chromium)
    runs-on: ubuntu-latest
    needs: quality
    # Les e2e requièrent de vrais contenus en base → gated sur le secret DATABASE_URL
    # (base Supabase publique, joignable depuis le runner). Absent = étapes ignorées.
    # NB : le contexte `secrets` est interdit dans un `if:` de job ; on le passe
    # par une variable d'environnement testée au niveau des étapes.
    timeout-minutes: 25
    env:
      HAS_DB: ${{ secrets.DATABASE_URL != '' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      IP_SALT: ${{ secrets.IP_SALT || 'ci-only-salt-do-not-use-in-prod-0123456789' }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://www.analyticatech.fr' }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS || 'http://localhost:3210,http://127.0.0.1:3210' }}
    steps:
      - name: Secret DATABASE_URL absent — e2e ignorés
        if: env.HAS_DB != 'true'
        run: echo "::notice::DATABASE_URL non configuré, e2e ignorés."
      - uses: actions/checkout@v4
        if: env.HAS_DB == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_DB == 'true'
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        if: env.HAS_DB == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-
      - run: npm ci
        if: env.HAS_DB == 'true'
      - run: npx prisma generate
        if: env.HAS_DB == 'true'
      - run: npx playwright install --with-deps chromium
        if: env.HAS_DB == 'true'
      - run: npm run test:e2e
        if: env.HAS_DB == 'true'
